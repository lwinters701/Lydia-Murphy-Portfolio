<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="164" viewBox="0 0 128 164">
  <defs>
    <!-- Block-print look: thin cocoa outline, then a cream halo around each motif -->
    <filter id="print" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="thin"/>
      <feFlood flood-color="#5a4636"/>
      <feComposite in2="thin" operator="in" result="outline"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.2" result="wide"/>
      <feFlood flood-color="#fbf8f1"/>
      <feComposite in2="wide" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="leaf">
      <path d="M0 30 C-8 29 -20 24 -22 10 C-11 10 -4 17 0 28 Z" fill="#7f9568"/>
      <path d="M-2 27 C-8 22 -13 17 -18 13" stroke="#b9c7a3" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
    <g id="sprig">
      <path d="M0 12 C-6 11 -13 7 -14 0 C-8 1 -3 5 0 10 Z" fill="#7f9568"/>
    </g>

    <g id="motif" filter="url(#print)">
      <path d="M0 40 V-4" stroke="#6c8256" stroke-width="3" stroke-linecap="round"/>
      <use xlink:href="#leaf"/>
      <use xlink:href="#leaf" transform="scale(-1,1)"/>
      <use xlink:href="#sprig"/>
      <use xlink:href="#sprig" transform="scale(-1,1)"/>
      <!-- scalloped bloom -->
      <path d="M-13.52 -8.38 Q-24.48 -12.00 -13.52 -15.62 Q-21.20 -24.24 -9.90 -21.90 Q-12.24 -33.20 -3.62 -25.52 Q-0.00 -36.48 3.62 -25.52 Q12.24 -33.20 9.90 -21.90 Q21.20 -24.24 13.52 -15.62 Q24.48 -12.00 13.52 -8.38 Q0 0 -13.52 -8.38 Z" fill="#e8aebb"/>
      <g stroke="#cf8599" stroke-width="1" stroke-linecap="round"><path d="M0 -12 L-10.34 -15.76"/><path d="M0 -12 L-7.64 -19.91"/><path d="M0 -12 L-3.40 -22.46"/><path d="M0 -12 L1.53 -22.89"/><path d="M0 -12 L6.15 -21.12"/><path d="M0 -12 L9.53 -17.50"/></g>
      <path d="M-7.50 -12.00 Q-13.00 -17.38 -5.30 -17.30 Q-5.38 -25.00 -0.00 -19.50 Q5.38 -25.00 5.30 -17.30 Q13.00 -17.38 7.50 -12.00 Z" fill="#cf8599"/>
      <path d="M-4 -12 A4 4 0 0 1 4 -12 Z" fill="#7f9568"/>
      <path d="M-9 -4 Q0 4 9 -4 Q0 -9 -9 -4 Z" fill="#6c8256"/>
    </g>
  </defs>

  <rect width="128" height="164" fill="#e2d48e"/>
  <!-- half-drop repeat -->
  <use xlink:href="#motif" x="32" y="82"/>
  <use xlink:href="#motif" x="96" y="0"/>
  <use xlink:href="#motif" x="96" y="164"/>
</svg>
