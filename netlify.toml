# Static site. The only "build" step fills in the site address below.
[build]
  publish = "."
  # Fill in the site's address for the link-preview tags, schema, robots.txt and sitemap.
  # Netlify sets $URL to the site's main address (custom domain once added).
  command = "sed -i \"s#__SITE_URL__#${URL}#g\" index.html robots.txt sitemap.xml"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
